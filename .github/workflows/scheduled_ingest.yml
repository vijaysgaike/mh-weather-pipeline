name: Scheduled ingestion
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: weather-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out the maintained dataset
        uses: actions/checkout@v4
        with:
          ref: weather-data
          path: .published
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Restore detailed runtime state when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .state
          artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=weather-state&per_page=100" --jq '.artifacts[] | select(.expired == false) | [.created_at,.id] | @tsv' | sort -r | head -n 1 | cut -f2)
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > .state/artifact.zip
            python -c "import zipfile; z=zipfile.ZipFile('.state/artifact.zip'); open('.state/weather-state.zip','wb').write(z.read('weather-state.zip'))"
            python scripts/state_archive.py restore .state/weather-state.zip
          else
            echo 'No runtime artifact; restoring accepted weather history from the data branch.'
          fi
      - name: Restore or reconcile the committed dataset
        run: python scripts/publish_data.py restore .published
      - run: weather-pipeline validate
      - name: Ingest (partial city failures still preserve accepted progress)
        id: ingest
        continue-on-error: true
        run: weather-pipeline run
      - name: Repair export and verify
        id: persist
        if: always() && steps.ingest.outcome != 'skipped' && steps.ingest.outcome != ''
        run: |
          weather-pipeline export-csv
          weather-pipeline validate
          python scripts/state_archive.py pack .state/weather-state.zip
      - name: Commit updated final data to GitHub
        if: always() && steps.persist.outcome == 'success'
        env:
          DATA_BRANCH: weather-data
        run: |
          python scripts/publish_data.py publish .published
          git -C .published config user.name 'github-actions[bot]'
          git -C .published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .published add -- weather_dataset.csv.gz daily manifest.json README.md
          if git -C .published diff --cached --quiet; then
            echo 'No new data; no commit needed.'
          else
            git -C .published commit -m "data: append weather observations for run $GITHUB_RUN_ID"
            git -C .published push origin "HEAD:$DATA_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.persist.outcome == 'success'
        with:
          name: weather-state
          path: .state/weather-state.zip
          retention-days: 90
          if-no-files-found: error
      - name: Report partial/failed ingestion
        if: steps.ingest.outcome == 'failure'
        run: exit 1
