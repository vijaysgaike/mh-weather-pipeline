name: Scheduled ingestion
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      seed_url:
        description: 'First run only: HTTPS URL to a packed state archive (prefer repository secret WEATHER_SEED_URL)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: weather-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    # Enable this repository variable only after reading the runbook and seeding state.
    if: github.event_name == 'workflow_dispatch' || vars.WEATHER_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Download last durable state or explicit first-run seed
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_URL: ${{ inputs.seed_url || secrets.WEATHER_SEED_URL }}
        run: |
          mkdir -p .state
          artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=weather-state&per_page=100" --jq '.artifacts[] | select(.expired == false) | [.created_at,.id] | @tsv' | sort -r | head -n 1 | cut -f2)
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > .state/artifact.zip
            python -c "import zipfile; z=zipfile.ZipFile('.state/artifact.zip'); open('.state/weather-state.zip','wb').write(z.read('weather-state.zip'))"
          elif [ -n "$SEED_URL" ]; then
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 300 "$SEED_URL" --output .state/weather-state.zip
          else
            echo 'No durable state found. Supply a packed initial state; refusing to reset history.' >&2
            exit 1
          fi
      - run: python scripts/state_archive.py restore .state/weather-state.zip
      - run: weather-pipeline validate
      - name: Ingest (partial city failures still preserve accepted progress)
        id: ingest
        continue-on-error: true
        run: weather-pipeline run
      - name: Repair export and verify
        id: persist
        if: always() && steps.ingest.outcome != 'skipped' && steps.ingest.outcome != ''
        run: |
          weather-pipeline export-csv
          weather-pipeline validate
          python scripts/state_archive.py pack .state/weather-state.zip
      - uses: actions/upload-artifact@v4
        if: always() && steps.persist.outcome == 'success'
        with:
          name: weather-state
          path: .state/weather-state.zip
          retention-days: 90
          if-no-files-found: error
      - name: Report partial/failed ingestion
        if: steps.ingest.outcome == 'failure'
        run: exit 1
